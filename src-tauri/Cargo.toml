[package]
name = "sumi"
version = "0.1.0"
description = "A free, open-source island for the top of your Windows screen."
authors = ["Rateur"]
license = "MIT"
repository = "https://github.com/Rateur/sumi"
edition = "2024"
rust-version = "1.100"

[lib]
name = "sumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Smaller, faster release binary (see Tauri's "App Size" guide).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
