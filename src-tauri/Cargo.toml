[package]
name = "sumi"
version = "0.5.0"
description = "A free, open-source island for the top of your Windows screen."
authors = ["Rateur"]
license = "MIT"
repository = "https://github.com/Rateur/sumi"
edition = "2024"
rust-version = "1.100"

[lib]
name = "sumi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
# windows is for COM, WinRT (media, privacy, apps) and a Win32 call that takes or returns a windows type in that code
# (HANDLE, PCWSTR, PWSTR); windows-sys for every other Win32 call, even in the same file.
# base64, windows and windows-sys already come with Tauri: Sumi only turns on the parts it reads.
base64 = "0.23"
windows = { version = "0.62", features = [
  "Media_Control",
  "Storage_Streams",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_MediaFoundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
# Its implement macro, for the callbacks Windows calls, names this crate directly. Same version as windows' own.
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Smaller, faster release binary (see Tauri's "App Size" guide).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
