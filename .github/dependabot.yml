# Minor and patch updates come grouped, one PR per ecosystem.
# Major updates come one by one, because they can break things and are judged case by case.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Follows the Node version in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # shortcut: typescript-eslint and svelte-check don't support TypeScript 7 yet; remove when they do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
