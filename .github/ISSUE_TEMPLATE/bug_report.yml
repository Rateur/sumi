name: Bug report
description: Something doesn't work as it should.
labels: ["bug", "needs triage"]
body:
  - type: checkboxes
    id: checked
    attributes:
      label: Before you report
      options:
        - label: I searched open and closed issues, and this isn't one of them.
          required: true
        - label: I reproduced it myself on the version below.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a song in Spotify
        2. Click the island
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sumi version
      description: Settings → Apps → Installed apps (Windows 10: Apps & features) → Sumi.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R and run `winver`.
      placeholder: "Windows 11 24H2 (26100.2033)"
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: How many screens, and their scale (Settings → Display).
      placeholder: "2 screens, 150 % and 100 %"
  - type: dropdown
    id: motion
    attributes:
      label: Animation effects in Windows
      description: Settings → Accessibility → Visual effects. When they're off, Sumi skips its animations on purpose.
      options:
        - "On"
        - "Off"
        - I don't know
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot or a short video helps.
